name: Release Multi-ABI APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (for example v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-ABI Release APKs (arm64-v8a, armeabi-v7a, x86_64, universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Signing Keystore
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=LockIN, OU=Android, O=LockIN, L=City, S=State, C=US"
          fi

      - name: Assemble Multi-ABI Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease || gradle :app:assembleRelease

      - name: Rename and Checksum ABI Release APKs
        run: |
          mkdir -p release-assets
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            if [ -f "app/build/outputs/apk/release/app-${abi}-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-${abi}-release.apk" "release-assets/LockIN-${VERSION}-${abi}.apk"
            fi
          done
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LockIN-Multi-ABI-APKs
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
