name: Publish Native GitHub Release (Multi-ABI APKs)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (for example v1.2.0)'
        required: true
        default: 'v1.2.0'

concurrency:
  group: release-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build & Publish Native GitHub Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare Release Signing Keystore
        run: |
          if [ -f release.keystore.base64 ]; then
            echo "Restoring release signing keystore from repository secret base64"
            base64 -d release.keystore.base64 > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            echo "Generating fallback keystore"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=LockIN, OU=Android, O=LockIN, L=City, S=State, C=US"
          fi

      - name: Assemble Multi-ABI Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --no-configuration-cache || gradle :app:assembleRelease --no-configuration-cache

      - name: Package & Checksum Release Assets
        id: package_assets
        run: |
          mkdir -p release-assets
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="v1.2.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            if [ -f "app/build/outputs/apk/release/app-${abi}-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-${abi}-release.apk" "release-assets/LockIN-${VERSION}-${abi}.apk"
            fi
          done
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish Native GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_assets.outputs.version }}
          name: "LockIN ${{ steps.package_assets.outputs.version }} — Material 3 Expressive Release"
          body: |
            ## LockIN ${{ steps.package_assets.outputs.version }}

            ### What's New
            - **Slot-Machine / Odometer Digital Clock (`H:MM:SS` / `MM:SS`)**: Fast-scrolling slot-machine reel transitions when switching duration presets, plus real-time per-second downward rolling countdown during active Focus Lock.
            - **Gen-Z Material 3 Expressive Red Cross Rain**: Custom 60fps geometric red cross rain (`ExpressiveRedCrossRain` & `ExpressiveCrossRainOverlayView`) with chunky pill X-charms, pinched 4-point starburst crosses, and squircle cutout badges when blocked apps are intercepted.
            - **Expressive Haptics & Synthesized Micro-Audio (`ExpressiveFeedbackEngine`)**: Zero-latency tactile and acoustic feedback for slot reel ticks, pill taps, lock activation chords, and block interception thuds.
            - **Bulletproof Bottom-Sheet Scroll Isolation**: Eliminates accidental sheet drag-dismissal when scrolling downward inside app lists.
            - **Portrait & Landscape Tablet Adaptive Layouts + Allowed Exception Apps**: Responsive portrait/landscape tablet layouts, Play Protect / Restricted Settings compliance, and whitelisted Focus Lock exception apps (Phone, GPay, utilities).
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
